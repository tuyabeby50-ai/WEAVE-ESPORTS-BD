<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--ink:#12152A;--bg:#F3F4F8;--card:#fff;--acc:#D71E28;--acc2:#B3171F;--accs:#FDECEC;--amber:#F2A41B;--green:#17A06B;--greens:#E1F6EC;--tx:#171A2B;--mu:#6B7088;--ln:#E3E5EE;--sh:0 1px 2px rgba(18,21,42,.06),0 4px 14px rgba(18,21,42,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;line-height:1.15}
.brand img{height:32px;width:auto}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.06em;color:#9AA0C3}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#12152A 0%,#2A1118 100%)}
#login form{background:var(--card);padding:28px;border-radius:18px;width:100%;max-width:370px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#login .brand{justify-content:center;font-size:18px;margin-bottom:6px}
#login .brand img{height:46px}
#login .brand small{color:var(--mu)}
#err{color:var(--acc);min-height:1.2em;margin:0;font-size:14px}
label{display:grid;gap:5px;font-size:14px;color:var(--mu);font-weight:500}
input,select,textarea{padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx)}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--acc2)}
.ghost{background:#fff;border:1px solid var(--ln);padding:10px 18px;border-radius:10px;cursor:pointer;color:var(--tx)}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .brand{padding:4px 10px 14px;font-size:15px}
#nav{display:grid;gap:2px}
.ng{font-size:11px;letter-spacing:.1em;color:#6D7399;padding:16px 12px 6px}
#nav button{background:none;border:0;color:#B7BBD3;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
#nav button span{flex:1}
#nav button:hover{background:#1F2340;color:#fff}
#nav button.on{background:var(--acc);color:#fff;font-weight:600}
#nav i{font-style:normal;background:var(--amber);color:#1A1200;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700;min-width:22px;text-align:center}
.me{margin-top:auto;padding:12px;font-size:13px;color:#8D92B0;word-break:break-all}
.me button{margin-top:8px;background:none;border:1px solid #3B4060;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
main{padding:28px 32px;min-width:0;max-width:1200px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:15px;margin:26px 0 12px;color:var(--mu);font-weight:600;letter-spacing:.03em}
h3{font-size:16px;margin:0 0 4px}
.ph,.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph p{margin:2px 0 0;color:var(--mu);font-size:14px}
.head h1{margin:0}
.warn{background:var(--accs);color:#8F1218;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:600;border:1px solid #F6C9CC}
.todos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.todo{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--sh)}
.todo .ti{width:42px;height:42px;border-radius:12px;background:var(--bg);color:var(--mu);display:grid;place-items:center}
.todo .tt b{display:block;font-size:26px;line-height:1.1}
.todo .tt small{color:var(--mu);font-size:13px}
.todo.hot{border-color:#F6C9CC;background:var(--accs)}
.todo.hot .ti{background:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);padding:16px;border-radius:14px;display:grid;box-shadow:var(--sh)}
.stat b{font-size:26px;line-height:1.15}
.stat span{color:var(--mu);font-size:14px}
.slot{background:var(--card);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:14px;align-items:center;margin-bottom:8px;box-shadow:var(--sh)}
.slot small{display:block;color:var(--mu)}
.slot span{text-align:right;font-weight:600}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:6px}
.bar i.full{background:var(--green)}
.search{max-width:340px;margin-bottom:14px}
.wrap{background:var(--card);border-radius:14px;overflow-x:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600;background:#F8F9FC;letter-spacing:.05em}
tbody tr:hover{background:#FAFBFD}
tr:last-child td{border-bottom:0}
.act{text-align:right}
.act button{border:1px solid var(--ln);background:#fff;color:var(--acc);cursor:pointer;padding:5px 12px;font-size:13px;font-weight:600;border-radius:8px;margin-left:6px}
.act button:hover{background:var(--accs)}
.act .ok{background:var(--greens);color:var(--green);border-color:transparent}
.act .del{color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:24px}
p.empty{text-align:left;padding:0}
.badge{padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--bg);display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-Pending{background:#FFF1D1;color:#8A5C00}
.b-Paid,.b-Approved,.b-Completed{background:var(--greens);color:var(--green)}
.b-Failed,.b-Cancelled,.b-Rejected,.b-due{background:#FBE1E1;color:var(--acc2)}
.lg{height:32px;width:32px;border-radius:8px;object-fit:cover;vertical-align:middle}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start}
.card{background:var(--card);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:var(--sh)}
.brow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px 10px}
.brow img{height:42px;width:78px;object-fit:cover;border-radius:6px;background:#fff}
.brow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu);font-size:13px}
dialog{border:0;border-radius:18px;padding:0;width:min(480px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(18,21,42,.6)}
#fm{padding:22px;display:grid;gap:14px}
#fm h2{margin:0;font-size:19px;color:var(--tx)}
#ff{display:grid;gap:12px;max-height:62vh;overflow-y:auto;padding:2px 4px 2px 0}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#tl{padding:22px;display:grid;gap:10px;max-height:80vh;overflow-y:auto}
#tl h2{color:var(--tx)}
.team{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);padding:9px 12px;border-radius:10px}
.team button{background:none;border:0;color:var(--acc);cursor:pointer;font-weight:600}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media(min-width:761px){#toast{bottom:24px}}
@media(max-width:760px){
 #app{grid-template-columns:1fr;align-content:start}
 aside{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:8px 14px;overflow:visible}
 aside .brand{padding:0}
 .me{margin:0;padding:0}
 .me br,#who{display:none}
 .me button{margin:0;padding:5px 12px}
 #nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--ink);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;border-top:1px solid #262B4A}
 .ng{display:none}
 #nav button{flex-direction:column;gap:3px;padding:7px 8px;min-width:66px;font-size:11.5px;position:relative;justify-content:center}
 #nav button span{flex:none}
 #nav i{position:absolute;top:2px;right:10px;padding:0 6px;font-size:11px}
 main{padding:16px 14px 90px}
 h1{font-size:21px}
 .slot{grid-template-columns:1fr 60px}
 .slot .bar{grid-column:1/-1;order:3}
 .wrap{background:transparent;box-shadow:none;overflow:visible}
 table{min-width:0}
 thead{display:none}
 tbody tr{display:block;background:var(--card);margin-bottom:10px;padding:8px 14px;border-radius:14px;box-shadow:var(--sh)}
 tbody tr:hover{background:var(--card)}
 tbody td{display:flex;justify-content:space-between;gap:14px;border:0;padding:5px 0;white-space:normal;text-align:right;align-items:center}
 tbody td::before{content:attr(data-l);color:var(--mu);font-size:13px;text-align:left;flex:none}
 tbody td.act{justify-content:flex-end;flex-wrap:wrap;gap:6px;padding-top:10px;margin-top:4px;border-top:1px solid var(--ln)}
 tbody td.act::before,tbody td.empty::before{content:none}
 tbody td.act button{margin-left:0}
 tbody td.empty{display:block;text-align:center}
}
</style>
</head>

const LIB = typeof firebase !== 'undefined';
const READY = !!CFG.apiKey && LIB;
let db, auth;
if (READY) { firebase.initializeApp(CFG); db = firebase.database(); auth = firebase.auth(); }
const $ = id => document.getElementById(id), R = p => db.ref(p);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const taka = n => '৳' + (+n || 0);

async function list(p, lim) {
  const r = lim ? R(p).limitToLast(lim) : R(p), s = await r.once('value'), a = [];
  s.forEach(c => { a.push({ id: c.key, ...(typeof c.val() === 'object' ? c.val() : {}) }); });
  return a;
}

const S = {
  matches: { title: 'ম্যাচ', f: [
    { k: 'category', l: 'ক্যাটাগরি', t: 'cat', col: 1 },
    { k: 'time', l: 'সময় (যেমন 08:00 PM)', pat: '\\d{1,2}:\\d{2}\\s?(AM|PM|am|pm)', col: 1 },
    { k: 'date', l: 'তারিখ (খালি রাখলে আজকের)', t: 'date', col: 1 },
    { k: 'map', l: 'ম্যাপ' },

    { k: 'fee', l: 'এন্ট্রি ফি (৳)', t: 'number', col: 1 },
    { k: 'prize', l: 'প্রাইজ (৳)', t: 'number', col: 1 },

    { k: 'totalSlots', l: 'মোট স্লট', t: 'number', def: 12, col: 1 },
    { k: 'sortOrder', l: 'সিরিয়াল (ছোট আগে)', t: 'number' },
    { k: 'whatsappLink', l: 'WhatsApp গ্রুপ লিংক' },
    { k: 'joinMessage', l: 'জয়েন মেসেজ' },
    { k: 'prizeList', l: 'প্রাইজ ডিটেইলস', t: 'area' },
    { k: 'rules', l: 'রুলস', t: 'area' },
    { k: 'isClosed', l: 'রেজিস্ট্রেশন বন্ধ', t: 'check' },
    { k: 'isHidden', l: 'ইউজারদের কাছে লুকানো', t: 'check' }
  ]},
  categories: { title: 'ক্যাটাগরি', f: [
    { k: 'name', l: 'নাম', col: 1 },
    { k: 'logo', l: 'লোগো (ইমেজ URL)', col: 1 },
    { k: 'notice', l: 'নোটিশ (ক্যাটাগরি খুললে পপআপ)', t: 'area' }

};
const svg = p => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  dash: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  matches: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  categories: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  payments: '<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/>',
  withdrawals: '<path d="M7 17 17 7M8 7h9v9"/>',
  cancels: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 20a6.5 6.5 0 0 0-3-5.5"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
const NAV = [['', [['dash', 'ড্যাশবোর্ড']]], ['কনটেন্ট', [['matches', 'ম্যাচ'], ['categories', 'ক্যাটাগরি']]], ['লেনদেন', [['payments', 'পেমেন্ট'], ['withdrawals', 'উইথড্র'], ['cancels', 'ক্যান্সেল']]], ['ম্যানেজ', [['users', 'ইউজার'], ['settings', 'সেটিংস']]]];
function navHtml() {
  return NAV.map(([g, items]) => (g ? `<div class="ng">${g}</div>` : '') + items.map(([k, l]) => `<button class="${k === view ? 'on' : ''}" onclick="go('${k}')">${svg(IC[k])}<span>${l}</span>${badge(k)}</button>`).join('')).join('');
}
let C = { matches: [], categories: [], withdrawals: [], deposits: [], slotreqs: [], users: [], cancels: [], settings: {} }, view = 'dash', q = '', cur = null;

async function load() {
  const bad = [];
  const safe = (n, p) => p.catch(e => { bad.push(n); console.error(n, e); return n === 'appSettings' ? { val: () => ({}) } : []; });
  const [m, c, w, s, dp, sr, cr] = await Promise.all([
    safe('ম্যাচ', list('matches')), safe('ক্যাটাগরি', list('categories')), safe('উইথড্র', list('withdrawals', 200)),
    safe('appSettings', R('appSettings').once('value')), safe('ডিপোজিট', list('deposit_requests', 100)),
    safe('স্লট পেমেন্ট', list('slot_requests', 100)), safe('ক্যান্সেল', list('cancelRequests', 100))]);
  m.sort((a, b) => (a.sortOrder || 999) - (b.sortOrder || 999));
  C = { matches: m, categories: c, withdrawals: w.reverse(), deposits: dp.reverse(), slotreqs: sr.reverse(), users: C.users, cancels: cr.reverse(), settings: s.val() || {} };
  render();
  applyAdminBrand();
  if (bad.length) toast('লোড হয়নি: ' + bad.join(', ') + ' (অ্যাডমিন অনুমতি বা Rules চেক করুন)');
  else { try { await Promise.all([R('admins/probe').once('value'), R('usedTrx/probe').once('value')]); } catch (e) { toast('Database Rules পুরনো। নতুন database.rules.json পেস্ট করে Publish করুন'); } }
}
async function go(v) { view = v; q = ''; render(); if (v === 'users') { try { await loadUsers(); render(); } catch (e) { toast(e.message); } } }
const pend = () => C.withdrawals.filter(w => w.status === 'Pending');
const payPend = () => [...C.deposits, ...C.slotreqs].filter(x => x.status === 'Pending');
function badge(k) { const n = k === 'withdrawals' ? pend().length : k === 'payments' ? payPend().length : k === 'cancels' ? C.cancels.filter(x => x.status === 'Pending').length : 0; return n ? `<i>${n}</i>` : ''; }

function render() {
  $('nav').innerHTML = navHtml();
  $('view').innerHTML = view === 'dash' ? dash() : view === 'payments' ? payView() : view === 'cancels' ? cancelView() : view === 'users' ? userView() : view === 'withdrawals' ? wdView() : view === 'settings' ? setView() : table(view);
  if (S[view]) rows();
  if (view === 'users') urows();
  if (view === 'settings') loadApi();
}

function dash() {
  const P = pend(), pp = payPend(), cp = C.cancels.filter(x => x.status === 'Pending');
  const sum = arr => arr.reduce((s, x) => s + (+x.amount || 0), 0);
  const todo = (n, l, to) => `<button class="todo ${n ? 'hot' : ''}" onclick="go('${to}')"><span class="ti">${svg(IC[to])}</span><span class="tt"><b>${n}</b><small>${l}</small></span></button>`;
  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  const slots = C.matches.slice(0, 12).map(m => {
    const n = +m.slots || 0, t = +m.totalSlots || 0, p = t ? Math.min(100, n / t * 100) : 0;
    return `<div class="slot"><div><b>${esc(m.time)}</b><small>${esc(m.category)} · ${esc(m.date || 'আজ')}</small></div><div class="bar"><i class="${p >= 100 ? 'full' : ''}" style="width:${p}%"></i></div><span>${n}/${t || '–'}</span></div>`;
  }).join('');
  return (C.settings.maintenanceMode ? '<div class="warn">মেইনটেন্যান্স মোড চালু আছে। ইউজাররা সাইট দেখতে পাচ্ছে না।</div>' : '') +
    `<div class="ph"><div><h1>ড্যাশবোর্ড</h1><p>সবকিছুর অবস্থা এক নজরে</p></div><button class="btn" onclick="go('matches');edit('matches')">+ নতুন ম্যাচ</button></div>
    <h2>এখন করণীয়</h2><div class="todos">${todo(pp.length, 'পেমেন্ট যাচাই বাকি', 'payments')}${todo(P.length, 'উইথড্র বাকি', 'withdrawals')}${todo(cp.length, 'ক্যান্সেল রিকোয়েস্ট', 'cancels')}</div>
    <h2>সারসংক্ষেপ</h2><div class="stats">${stat(C.matches.length, 'ম্যাচ')}${stat(C.categories.length, 'ক্যাটাগরি')}${stat(taka(sum(pp)), 'পেমেন্ট পেন্ডিং')}${stat(taka(sum(P)), 'উইথড্র পেন্ডিং')}</div>
    <h2>স্লট কতটা ভরেছে</h2>` + (slots || '<p class="empty">এখনও কোনো ম্যাচ নেই। "ম্যাচ" ট্যাবে গিয়ে যোগ করুন।</p>');
}

function cell(f, v) {
  if (f.k === 'logo') return v ? `<img class="lg" src="${esc(v)}" alt="">` : '–';
  if (f.t === 'number' && ['fee', 'prize'].includes(f.k)) return taka(v);
  return esc(v) || '–';
}
function table(c) {
  const s = S[c], cols = s.f.filter(f => f.col);

async function wd(id, ok) {
  const w = C.withdrawals.find(x => x.id === id);
  if (!w || w.status !== 'Pending') return;
  let warn = '';
  if (ok) {
    try {
      const h = await list(`users/${w.uid}/wallet/history`);
      const prize = h.filter(r => /prize/i.test(r.type || '')).reduce((t, r) => t + (+r.amount || 0), 0);
      const all = h.filter(r => r.type === 'Withdraw' && !/Failed|Cancel/i.test(r.status || '')).reduce((t, r) => t + (+r.amount || 0), 0);
      if (all > prize) warn = `\n\n⚠️ সতর্কতা: এই ইউজারের মোট প্রাইজ ${taka(prize)}, কিন্তু উইথড্র অনুরোধ মোট ${taka(all)}। ডিপোজিটের টাকা উইথড্র করা যাবে না। অনুমোদন না করাই ভালো।`;
    } catch (e) { /* যাচাই ব্যর্থ হলে সাধারণ নিশ্চিতকরণ */ }
  }
  if (!confirm(ok ? `${taka(w.amount)} পাঠানো হয়েছে বলে মার্ক করবেন?${warn}` : `বাতিল করে ${taka(w.amount)} ইউজারের ওয়ালেটে ফেরত দেবেন?`)) return;
  const st = ok ? 'Paid' : 'Failed';
  try {
    const r = await R(`withdrawals/${id}/status`).transaction(s => (s === null || s === 'Pending') ? st : undefined);
    if (!r.committed) { toast('এটি আগেই প্রসেস হয়েছে'); return load(); }
    const h = await R(`users/${w.uid}/wallet/history`).orderByChild('time').equalTo(w.time).once('value'), up = {};
    h.forEach(c => { up[c.key + '/status'] = st; });
    if (Object.keys(up).length) await R(`users/${w.uid}/wallet/history`).update(up);
    if (!ok) await R(`users/${w.uid}/wallet/balance`).transaction(b => (+b || 0) + Number(w.amount));
    toast(ok ? 'পেইড মার্ক হয়েছে' : 'ব্যালেন্স ফেরত গেছে'); await load();
  } catch (x) { toast(x.message); }
}

async function checkCap(x) {
  const need = (x.teamsData || [1]).length;
  for (const mid of x.matchIds || []) {
    const m = (await R('matches/' + mid).once('value')).val();
    if (!m) return 'একটি ম্যাচ আর নেই।';
    if ((+m.totalSlots || 0) - (+m.slots || 0) < need) return `${m.time} ম্যাচে পর্যাপ্ত স্লট নেই।`;
  }
  return null;
}
async function finishDeposit(x, ok) {
  if (ok) await R(`users/${x.uid}/wallet/nonWithdrawableBalance`).transaction(b => (+b || 0) + Number(x.amount));
  if (x.historyKey) await R(`users/${x.uid}/wallet/history/${x.historyKey}`).update({ status: ok ? 'Completed' : 'Failed' });
}
async function finishSlot(x) {
  const now = Date.now(), d = new Date(), dateStr = d.getDate() + ' ' + d.toLocaleString('en', { month: 'short' }).toUpperCase() + ' ' + d.getFullYear();
  const teams = x.teamsData || [{ squadName: x.squadName, playerName: x.playerName }], ups = {};
  for (const mid of x.matchIds || []) {
    for (const t of teams) {
      const reg = { team: t.squadName, playerLength: t.playerName, status: 'Paid(Manual)', time: Date.now(), isFake: false, uid: x.uid };
      const snap = await R('registrations/' + mid).once('value');
      let fake = null, n = 0;
      snap.forEach(c => { n++; if (c.val().isFake && !fake) fake = c.key; });
      if (n >= 10 && fake) {
        const k = R('registrations/' + mid).push().key;
        await R('registrations/' + mid).update({ [fake]: null, [k]: reg });
      } else {
        await R('registrations/' + mid).push(reg);
        await R(`matches/${mid}/slots`).transaction(s => (s || 0) + 1);
      }
    }
    const m = (await R('matches/' + mid).once('value')).val() || {};
    ups[`users/${x.uid}/purchasedSlots/${mid}`] = { matchId: mid, time: m.time || '', date: dateStr, whatsappGroupLink: m.whatsappLink || '#', joinMessage: m.joinMessage || 'WhatsApp Group Link', joinStatus: 'Joined', joinedAt: now, teamName: teams[0].squadName };
  }
  await db.ref().update(ups);
  await R(`users/${x.uid}/wallet/history`).push({ type: 'Slot Booking', amount: Number(x.amount), time: now, status: 'Paid', slotsCount: (x.matchIds || []).length * teams.length });
}
async function payAct(kind, id, ok) {
  const col = kind === 'deposit' ? 'deposit_requests' : 'slot_requests';
  const x = (kind === 'deposit' ? C.deposits : C.slotreqs).find(r => r.id === id);
  if (!x || x.status !== 'Pending') return;
  if (!confirm(ok ? `${taka(x.amount)} পেমেন্ট ভেরিফাই করেছেন? অনুমোদনে ${kind === 'deposit' ? 'ইউজারের ব্যালেন্স যোগ হবে।' : 'স্লট কনফার্ম হবে।'}` : 'রিকোয়েস্ট বাতিল করবেন?')) return;
  try {
    if (ok && kind === 'slot') { const err = await checkCap(x); if (err) return toast(err); }
    if (ok && x.trxId) { let dup = false; try { dup = (await R('usedTrx/' + tk(x.trxId)).once('value')).exists(); } catch (e) { /* পুরনো Rules */ } if (dup) return toast('এই TrxID আগেই ব্যবহার হয়েছে (ডুপ্লিকেট)'); }
    const r = await R(`${col}/${id}/status`).transaction(s => (s === null || s === 'Pending') ? (ok ? 'Approved' : 'Failed (Rejected)') : undefined);
    if (!r.committed) { toast('এটি আগেই প্রসেস হয়েছে'); return load(); }
    if (ok && x.trxId) { try { await R('usedTrx/' + tk(x.trxId)).set({ uid: x.uid, kind, amount: Number(x.amount), time: Date.now(), by: 'admin' }); } catch (e) { /* পুরনো Rules */ } }
    if (kind === 'deposit') await finishDeposit(x, ok); else if (ok) await finishSlot(x);
    toast(ok ? 'অনুমোদিত হয়েছে' : 'বাতিল হয়েছে'); await load();
  } catch (e) { toast(e.message); }
}

async function cancelAct(id, ok) {
  const x = C.cancels.find(r => r.id === id);
  if (!x || x.status !== 'Pending') return;
  let refund = 0;
  if (ok) {
    const m = (await R('matches/' + x.matchId).once('value')).val() || {};
    const v = prompt('কত টাকা ফেরত দেবেন? (০ দিলে ফেরত নেই। টাকা বোনাস ব্যালেন্সে যাবে, যা শুধু স্লটে খরচ করা যায়)', m.fee || 0);
    if (v === null) return;
    refund = Math.max(0, Number(v) || 0);
  } else if (!confirm('রিকোয়েস্ট বাতিল করবেন?')) return;
  try {
    const r = await R(`cancelRequests/${id}/status`).transaction(s => (s === null || s === 'Pending') ? (ok ? 'Approved' : 'Rejected') : undefined);
    if (!r.committed) { toast('এটি আগেই প্রসেস হয়েছে'); return load(); }
    const reg = R(`registrations/${x.matchId}/${x.regId}`), ex = (await reg.once('value')).exists();
    if (ok) {
      if (ex) { await reg.remove(); await R(`matches/${x.matchId}/slots`).transaction(s => Math.max(0, (s || 0) - 1)); }
      if (refund) {
        await R(`users/${x.uid}/wallet/nonWithdrawableBalance`).transaction(b => (+b || 0) + refund);
        await R(`users/${x.uid}/wallet/history`).push({ type: 'Refund (Cancel)', amount: refund, time: Date.now(), status: 'Completed' });
      }

    toast(ok ? 'অনুমোদিত হয়েছে' : 'বাতিল হয়েছে'); await load();
  } catch (e) { toast(e.message); }
}

function pickImg(id, max) {
  const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
  f.onchange = () => {
    const file = f.files[0]; if (!file) return;
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = /png|webp|gif|svg/.test(file.type);
      $(id).value = c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.72);
      toast('ছবি বসেছে। এবার সেভ করুন');
    };
    img.src = URL.createObjectURL(file);
  };
  f.click();
}
